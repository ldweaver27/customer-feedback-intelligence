<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Company | Customer Feedback Intelligence</title>
</head>

<body>

    <h1>Edit Company</h1>

    {% if error %}
        <p><strong>{{ error }}</strong></p>
    {% endif %}

    <form method="POST">

        <label for="name">Company Name</label><br>
        <input
            type="text"
            id="name"
            name="name"
            value="{{ company.name }}"
            required
        >

        <br><br>

        <label for="arr">ARR (optional)</label><br>
        <input
            type="number"
            id="arr"
            name="arr"
            min="0"
            step="0.01"
            value="{{ company.arr if company.arr is not none else '' }}"
        >

        <br><br>

        <button type="submit">Save Changes</button>

        <a href="{{ url_for('companies') }}">Cancel</a>

    </form>

</body>
</html>
