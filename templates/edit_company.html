{% extends "base.html" %}

{% block title %}
    Edit Company | Customer Feedback Intelligence
{% endblock %}

{% block content %}

<h1>Edit Company</h1>

{% if error %}
    <p><strong>{{ error }}</strong></p>
{% endif %}

<div class="card">

    <form method="POST">

        <label for="name">Company Name</label><br>

        <input
            type="text"
            id="name"
            name="name"
            value="{{ company.name }}"
            required
        >

        <br><br>

        <label for="arr">ARR (optional)</label><br>

        <input
            type="number"
            id="arr"
            name="arr"
            min="0"
            step="0.01"
            value="{{ company.arr if company.arr is not none else '' }}"
        >

        <br><br>

        <button type="submit">
            Save Changes
        </button>

        <a href="{{ url_for('companies') }}">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
