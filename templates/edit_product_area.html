<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product Area | Customer Feedback Intelligence</title>
</head>

<body>

    <h1>Edit Product Area</h1>

    <form method="POST">

        <label for="name">Product Area Name</label><br>
        <input
            type="text"
            id="name"
            name="name"
            value="{{ area.name }}"
            required
        >

        <br><br>

        <label for="description">Description</label><br>
        <textarea
            id="description"
            name="description"
            rows="4"
            cols="60"
            required>{{ area.description }}</textarea>

        <br><br>

        <label for="core_functionality">Core Functionality</label><br>
        <textarea
            id="core_functionality"
            name="core_functionality"
            rows="4"
            cols="60"
            required>{{ area.core_functionality }}</textarea>

        <br><br>

        <button type="submit">Save Changes</button>

        <a href="{{ url_for('product_areas') }}">Cancel</a>

    </form>

</body>
</html>
